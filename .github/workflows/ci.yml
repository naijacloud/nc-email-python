name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installed rather than run from the checkout, so the wheel's contents —
      # including py.typed — are what gets tested.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .

      # No network and no third-party packages: the suite runs against a local
      # mock HTTP server, and a CI runner without egress must still go green.
      - name: Test
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: python -m pip install --upgrade pip build && python -m build

      # A wheel missing py.typed type-checks as Any at every call site, which is
      # the sort of thing nobody notices until a customer reports it.
      - name: Check the type marker shipped
        run: python -c "import zipfile,glob,sys; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'nc_email/py.typed' in names else 'py.typed missing from the wheel')"
